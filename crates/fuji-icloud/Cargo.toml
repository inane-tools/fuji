[package]
name = "fuji-icloud"
description = "iCloud Photos client: Apple ID sign-in and library access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
num-bigint = "0.5.1"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json", "cookies"] }
uuid = { version = "1.26.1", features = ["v4"] }
