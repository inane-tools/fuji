[package]
name = "fuji-icloud"
description = "iCloud Photos client: Apple ID sign-in and library access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.1"
base64 = "0.23.1"
ctr = "0.10.1"
flate2 = "1.1.11"
hkdf = "0.13.0"
hmac = "0.13.0"
num-bigint = "0.5.1"
p256 = { version = "0.14.0", features = ["arithmetic", "ecdsa"] }
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
plist = "1.10.3"
rand = "0.10.3"
rsa = "0.10.0"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5.2", features = ["json", "cookies"] }
uuid = { version = "1.26.1", features = ["v4"] }
