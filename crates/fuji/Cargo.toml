[package]
name = "fuji"
description = "iCloud Photos client for Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dirs = "7.0.0"
fuji-icloud.workspace = true
futures = "0.3.34"
gpui.workspace = true
keyring = { version = "3.6", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-segmentation = "1.13.3"
