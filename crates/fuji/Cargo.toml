[package]
name = "fuji"
description = "iCloud Photos client for Windows and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
dirs = "7.0.0"
fuji-icloud.workspace = true
futures = "0.3.34"
gpui.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2.43"
p256 = { version = "0.14.0", features = ["arithmetic", "ecdsa"] }
keyring = { version = "3.6", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-segmentation = "1.13.3"
ureq = { version = "3.5.2", features = ["json"] }
smallvec = "1"

[target.'cfg(windows)'.dependencies]
# The same version GPUI uses, for the clipboard and drag-out glue in platform.rs.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # These two are needed to implement IDataObject.
    "Win32_Graphics_Gdi",
    # Passkey sign-in (webauthn.dll).
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # The accent color.
    "Win32_System_Registry",
    # Video playback (Media Engine) and its frames (WIC).
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# `#[implement]` expands to paths in this crate.
windows-core = "0.61"

[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
embed-resource = "3"

