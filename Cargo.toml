[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
fuji-icloud = { path = "crates/fuji-icloud" }
# GPUI is pre-1.0 and changes often: keep it pinned and upgrade on purpose.
gpui = "=0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dependencies optimized in debug builds so the UI stays smooth while developing.
# A little optimization for fuji itself too: layout and scrolling run every frame.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# gpui 0.2.2 pins xattr 0.2.3, which doesn't build on Linux with current
# libc (ENOATTR is gone there); this copy uses ENODATA, its other name.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
